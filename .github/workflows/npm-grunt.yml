name: 2.2 IPA Maker

on:
  workflow_dispatch:
    inputs:
      name:
        description: "GDPS Name"
        required: true
      url:
        description: "GDPS URL (33 CHARACTERS)"
        required: true
      bundle:
        description: "BUDNLE ID (23 CHARACTERS)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        wget -L https://files.141412.xyz/r/base.ipa -O base.ipa
        npm install
        echo name=${{ inputs.name }} > .env
        echo bundle=${{ inputs.bundle }} >> .env
        echo url=${{ inputs.url }} >> .env
        node index.js

        SANITIZED_NAME="$(printf '%s' '${{ inputs.name }}' | tr -d '[:space:]')"
        if [ ! -f "${SANITIZED_NAME}.ipa" ]; then
          echo "Expected IPA not found: ${SANITIZED_NAME}.ipa"
          find . -maxdepth 2 -name "*.ipa" -ls || true
          exit 1
        fi

        mv "${SANITIZED_NAME}.ipa" output.ipa
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.3.4
      with:
        name: "IPA Output"
        path: "output.ipa"
        if-no-files-found: warn
